  const STATUS = {
    on_track: { label: "По плану", ic: "✓" },
    attention: { label: "Требует внимания", ic: "!" },
    at_risk: { label: "В зоне риска", ic: "▲" },
  };
  const SRC = { checklist: "чек-лист", jira: "jira", assignment: "назначение" };
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const ringColor = (st) => (st === "at_risk" ? "var(--crit)" : st === "attention" ? "var(--warn)" : "var(--good)");

  function ring(percent, status) {
    const R = 82, C = 2 * Math.PI * R;
    const off = C * (1 - percent / 100);
    return `
      <div class="ring">
        <svg width="190" height="190" viewBox="0 0 190 190" aria-hidden="true">
          <circle cx="95" cy="95" r="${R}" fill="none" stroke="var(--track)" stroke-width="14"></circle>
          <circle cx="95" cy="95" r="${R}" fill="none" stroke="${ringColor(status)}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"
            style="transition: stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)" data-off="${off.toFixed(1)}"></circle>
        </svg>
        <div class="center">
          <div class="pct">${percent}<span>%</span></div>
          <div class="plabel">готовности</div>
        </div>
      </div>`;
  }

  function tiles(p) {
    const noTask = !p.jira.has_active_task;
    return `
      <div class="tiles">
        <div class="tile"><div class="k">День адаптации</div><div class="v">${p.day}<small> / старт ${esc(p.start_date)}</small></div></div>
        <div class="tile ${noTask ? "flag" : "flag zero"}"><div class="k">Задач в работе</div><div class="v">${p.jira.in_progress}<small> из ${p.jira.total} · done ${p.jira.done}</small></div></div>
        <div class="tile"><div class="k">Вех пройдено</div><div class="v">${p.milestones.filter((m) => m.done).length}<small> / ${p.milestones.length}</small></div></div>
        <div class="tile ${p.warnings.length ? "flag" : "flag zero"}"><div class="k">Ворнинги</div><div class="v">${p.warnings.length}</div></div>
      </div>`;
  }

  function milestones(p) {
    return `<div class="card"><h2>Чек-лист адаптации</h2><ul class="miles">${p.milestones
      .map(
        (m) => `<li>
          <span class="check ${m.done ? "done" : "todo"}">${m.done ? "✓" : ""}</span>
          <span class="mlabel ${m.done ? "done" : "todo"}">${esc(m.label)}</span>
          <span class="msrc">${SRC[m.source] || m.source}</span>
          <span class="mweight">${m.weight}%</span>
        </li>`,
      )
      .join("")}</ul></div>`;
  }

  function warnings(p) {
    if (!p.warnings.length) {
      return `<div class="card"><h2>Ворнинги</h2><div class="allgood">✓ Нет — новичок идёт по плану</div></div>`;
    }
    const icon = (s) => (s === "critical" ? "🔴" : s === "warning" ? "🟠" : "🔵");
    return `<div class="card"><h2>Ворнинги · ${p.warnings.length}</h2><div class="warns">${p.warnings
      .map(
        (w) => `<div class="warn-item ${w.severity}">
          <div class="wic">${icon(w.severity)}</div>
          <div>
            <div class="wt">${esc(w.title)}</div>
            <div class="wd">${esc(w.detail)}</div>
            <div class="wa"><span class="arrow">→</span><span>${esc(w.action)}</span></div>
          </div>
        </div>`,
      )
      .join("")}</div></div>`;
  }

  function buddySection(d) {
    const a = d.buddy.assigned;
    if (a && !a.unknown) {
      return `<div class="card"><div class="buddy-head"><h2>Назначенный бадди</h2></div>

          <div class="ava">${esc(a.buddy_id.slice(4, 6)).toUpperCase()}</div>

          </div>
          <div class="chips" style="margin-left:auto">${(a.skills || []).slice(0, 6).map((s) => `<span class="chip">${esc(s)}</span>`).join("")}</div>
        </div></div>`;
    }
    const cands = d.buddy.suggestions || [];
    const max = Math.max(1, ...cands.map((c) => c.score));
    return `<div class="card"><div class="buddy-head"><h2>Подбор бадди — топ-${cands.length}</h2><span class="sub">нейронка ранжирует по команде · роли · навыкам · старшинству</span></div>
      <div class="cand-grid">${cands
        .map(
          (c, i) => `<div class="cand ${i === 0 ? "top" : ""}">
            <span class="rank">#${i + 1}</span>
            <div class="bid">${esc(c.buddy_id)}</div>
            <div class="who">${esc(c.position)}<br><span class="team">${esc(c.department)} / ${esc(c.team)} · ${esc(c.seniority)}</span></div>
            <div class="scorebar"><div class="bar"><i style="width:${Math.round((c.score / max) * 100)}%"></i></div><span class="sv">${c.score}</span></div>
            <div class="chips">${(c.shared_skills.length ? c.shared_skills : ["нет общих навыков"]).map((s) => `<span class="chip ${c.shared_skills.length ? "" : "muted"}">${esc(s)}</span>`).join("")}</div>
            <ul class="reasons">${c.reasons.map((r) => `<li><span class="rp ${r.points < 0 ? "neg" : ""}">${r.points > 0 ? "+" : ""}${r.points}</span><span>${esc(r.detail)}</span></li>`).join("")}</ul>
          </div>`,
        )
        .join("")}</div></div>`;
  }

  function render(i) {
    const d = DATA[i];
    const p = d.progress;
    const n = d.newbie;
    const st = STATUS[p.status];
    document.getElementById("dash").innerHTML = `
      <div class="grid hero">
        <div class="card ring-card">
          ${ring(p.percent, p.status)}
          <div class="status-chip ${p.status}"><span class="ic">${st.ic}</span>${st.label}</div>

        </div>
        <div class="card">
          <h2>Сводка</h2>
          ${tiles(p)}
        </div>
      </div>
      <div class="grid cols">
        ${milestones(p)}
        ${warnings(p)}
      </div>
      ${buddySection(d)}`;

    // animate ring
    requestAnimationFrame(() => {
      const arc = document.querySelector(".ring circle[data-off]");
      if (arc) requestAnimationFrame(() => (arc.style.strokeDashoffset = arc.dataset.off));
    });

    document.querySelectorAll("#switcher button").forEach((b, j) => b.setAttribute("aria-selected", j === i ? "true" : "false"));
  }

  function init() {
    const sw = document.getElementById("switcher");
    sw.innerHTML = DATA.map(
      (d, i) => `<button role="tab" aria-selected="${i === 0}"><span class="dot ${d.progress.status}"></span>${esc(d.newbie.id)}</button>`,
    ).join("");
    sw.querySelectorAll("button").forEach((b, i) => b.addEventListener("click", () => render(i)));
    render(0);
  }
  init();
</script>
